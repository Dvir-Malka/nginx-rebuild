# Custom server for the compatibility test. It replaces conf.d/default.conf
# in both containers, so every request in CustomConfig hits these rules.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Small limit, so the "body too large" test needs only 2 KB.
    client_max_body_size 1k;

    # Compression must produce the same bytes on both images.
    gzip on;

    location = /hello {
        add_header X-Test "echo" always;
        return 200 "hello\n";
    }

    location = /old {
        return 301 /new;
    }

    # rewrite with captures; the original query string is appended.
    location /rw/ {
        rewrite ^/rw/(\w+)/(\d+)$ /echo?name=$1&id=$2 last;
    }

    # rewrite that answers with a redirect instead of an internal jump.
    location /go/ {
        rewrite ^/go/(.*)$ /hello?from=$1 redirect;
    }

    # Shows what the rewrites produced.
    location = /echo {
        return 200 "uri=$uri args=$args\n";
    }

    location = /upload {
        return 200 "got $content_length bytes\n";
    }
}
